spring:
  application:
    name: ztemizinden-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/ztemizinden}
    username: ${DB_USERNAME:ztemizinden}
    password: ${DB_PASSWORD:ztemizinden}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app,https://*.ngrok-free.app,https://*.ngrok.app,https://*.ngrok.io}
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/ztemizinden}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/ztemizinden/protocol/openid-connect/certs}
    audience: ${KEYCLOAK_AUDIENCE:ztemizinden-api}
    realm: ${KEYCLOAK_REALM:ztemizinden}
    web-client-id: ${KEYCLOAK_WEB_CLIENT_ID:ztemizinden-web}
    admin-base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8081}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:ztemizinden-backend-admin}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:ztemizinden-local-admin-secret-change-me}
    password-reset-redirect-uri: ${KEYCLOAK_PASSWORD_RESET_REDIRECT_URI:http://localhost:5173/customer/login}
    password-reset-lifespan-seconds: ${KEYCLOAK_PASSWORD_RESET_LIFESPAN_SECONDS:900}
    migrate-legacy-users: ${KEYCLOAK_MIGRATE_LEGACY_USERS:false}
  upload:
    root-dir: ${APP_UPLOAD_DIR:uploads}
    orphan-grace-period: ${APP_UPLOAD_ORPHAN_GRACE_PERIOD:24h}
    orphan-cleanup-cron: "${APP_UPLOAD_ORPHAN_CLEANUP_CRON:0 15 3 * * *}"
  demo-data:
    ensure-demo-accounts: ${APP_DEMO_ENSURE_ACCOUNTS:false}
    reset-and-seed: ${APP_DEMO_RESET_AND_SEED:false}
server:
  port: ${SERVER_PORT:8080}
