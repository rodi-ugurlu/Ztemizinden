spring:
  datasource:
    url: jdbc:h2:mem:ztemizinden-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

app:
  security:
    enabled: false
  keycloak:
    issuer-uri: http://localhost:8081/realms/ztemizinden
    jwk-set-uri: http://localhost:8081/realms/ztemizinden/protocol/openid-connect/certs
    admin-client-secret: ztemizinden-test-admin-secret
