name: Ztemizinden CI/CD Deployment

on:
  push:
    branches:
      - prod

concurrency:
  group: maintly-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_API_URL: /api
      VITE_KEYCLOAK_URL: https://maintly.net/auth
      VITE_KEYCLOAK_REALM: ztemizinden
      VITE_KEYCLOAK_CLIENT_ID: ztemizinden-web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build and Test Full-Stack JAR
        run: |
          set -euo pipefail
          cd Ztemizinden-Backend
          chmod +x mvnw
          ./mvnw -Pfullstack clean package

      - name: Reject Localhost Identity Configuration
        run: |
          set -euo pipefail
          if grep -R --binary-files=text -F "http://localhost:8081" Ztemizinden-Backend/target/classes/static; then
            echo "Production frontend contains the local Keycloak URL."
            exit 1
          fi
          grep -R --binary-files=text -F "https://maintly.net/auth" Ztemizinden-Backend/target/classes/static >/dev/null

      - name: Assemble Release Bundle
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/keycloak/realm
          mkdir -p release/keycloak/themes
          install -m 0644 Ztemizinden-Backend/target/ztemizinden.jar release/ztemizinden.jar
          install -m 0644 deploy/ztemizinden.service release/ztemizinden.service
          install -m 0644 deploy/keycloak-compose.yml release/keycloak/docker-compose.yml
          install -m 0644 deploy/keycloak-realm-production.json release/keycloak/realm/realm-production.json
          cp -R deploy/keycloak-theme/maintly release/keycloak/themes/maintly
          install -m 0644 deploy/nginx-keycloak-location.conf release/nginx-keycloak-location.conf
          install -m 0644 deploy/nginx-ztemizinden.conf release/nginx-ztemizinden.conf

      - name: Copy Release to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "release/*"
          target: "/tmp/ztemizinden-release"
          strip_components: 1
          overwrite: true

      - name: Deploy, Verify, and Roll Back on Failure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -Eeuo pipefail

            RELEASE_DIR=/tmp/ztemizinden-release
            APP_DIR=/opt/ztemizinden
            IDENTITY_DIR=/opt/ztemizinden/keycloak
            APP_ENV=/etc/ztemizinden/ztemizinden.env
            IDENTITY_ENV=/etc/ztemizinden/keycloak.env
            NGINX_SNIPPET=/etc/nginx/snippets/maintly-keycloak.conf
            NGINX_ENABLED_SITE=/etc/nginx/sites-enabled/ztemizinden
            JAR_PATH=/opt/ztemizinden/ztemizinden.jar
            PREVIOUS_JAR=/opt/ztemizinden/ztemizinden.jar.previous

            for command in curl docker grep install nginx python3 systemctl; do
              command -v "$command" >/dev/null || { echo "Missing required command: $command"; exit 1; }
            done
            docker compose version >/dev/null

            test -s "$RELEASE_DIR/ztemizinden.jar"
            test -s "$RELEASE_DIR/ztemizinden.service"
            test -s "$RELEASE_DIR/keycloak/docker-compose.yml"
            test -s "$RELEASE_DIR/keycloak/realm/realm-production.json"
            test -s "$RELEASE_DIR/keycloak/themes/maintly/login/theme.properties"
            test -s "$RELEASE_DIR/keycloak/themes/maintly/login/resources/css/maintly.css"
            test -s "$RELEASE_DIR/keycloak/themes/maintly/login/resources/img/maintly-logo.webp"
            test -s "$RELEASE_DIR/nginx-keycloak-location.conf"
            test -s "$RELEASE_DIR/nginx-ztemizinden.conf"
            test -s "$APP_ENV" || { echo "$APP_ENV is missing"; exit 1; }
            test -s "$IDENTITY_ENV" || { echo "$IDENTITY_ENV is missing"; exit 1; }

            for variable in \
              DB_URL DB_USERNAME DB_PASSWORD \
              KEYCLOAK_ISSUER_URI KEYCLOAK_JWK_SET_URI KEYCLOAK_ADMIN_BASE_URL \
              KEYCLOAK_ADMIN_CLIENT_SECRET KEYCLOAK_PASSWORD_RESET_REDIRECT_URI; do
              grep -Eq "^${variable}=.+" "$APP_ENV" || {
                echo "$variable is missing from $APP_ENV"
                exit 1
              }
            done
            for variable in \
              KEYCLOAK_DB_PASSWORD KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME \
              KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD KEYCLOAK_ADMIN_CLIENT_SECRET \
              KEYCLOAK_SMTP_HOST KEYCLOAK_SMTP_FROM KEYCLOAK_SMTP_USERNAME \
              KEYCLOAK_SMTP_PASSWORD MAINTLY_ADMIN_EMAIL MAINTLY_ADMIN_PASSWORD; do
              grep -Eq "^${variable}=.+" "$IDENTITY_ENV" || {
                echo "$variable is missing from $IDENTITY_ENV"
                exit 1
              }
            done

            grep -Fxq "KEYCLOAK_ISSUER_URI=https://maintly.net/auth/realms/ztemizinden" "$APP_ENV"
            grep -Fxq "KEYCLOAK_JWK_SET_URI=https://maintly.net/auth/realms/ztemizinden/protocol/openid-connect/certs" "$APP_ENV"
            grep -Fxq "KEYCLOAK_ADMIN_BASE_URL=https://maintly.net/auth" "$APP_ENV"

            backend_secret="$(grep '^KEYCLOAK_ADMIN_CLIENT_SECRET=' "$APP_ENV" | tail -n 1 | cut -d= -f2-)"
            identity_secret="$(grep '^KEYCLOAK_ADMIN_CLIENT_SECRET=' "$IDENTITY_ENV" | tail -n 1 | cut -d= -f2-)"
            test "$backend_secret" = "$identity_secret" || {
              echo "Backend and Keycloak admin client secrets do not match"
              exit 1
            }

            install -d -m 0755 "$APP_DIR" "$IDENTITY_DIR/realm" "$IDENTITY_DIR/themes"
            install -m 0644 "$RELEASE_DIR/keycloak/docker-compose.yml" "$IDENTITY_DIR/docker-compose.yml"
            install -m 0644 "$RELEASE_DIR/keycloak/realm/realm-production.json" "$IDENTITY_DIR/realm/realm-production.json"
            rm -rf "$IDENTITY_DIR/themes/maintly.next"
            cp -R "$RELEASE_DIR/keycloak/themes/maintly" "$IDENTITY_DIR/themes/maintly.next"
            rm -rf "$IDENTITY_DIR/themes/maintly"
            mv "$IDENTITY_DIR/themes/maintly.next" "$IDENTITY_DIR/themes/maintly"

            install -d -m 0755 /etc/nginx/snippets
            install -m 0644 "$RELEASE_DIR/nginx-keycloak-location.conf" "$NGINX_SNIPPET"
            test -e "$NGINX_ENABLED_SITE" || { echo "$NGINX_ENABLED_SITE is missing"; exit 1; }
            NGINX_SITE_TARGET="$(readlink -f "$NGINX_ENABLED_SITE")"
            install -d -m 0700 /var/backups/maintly
            cp -p "$NGINX_SITE_TARGET" /var/backups/maintly/nginx-ztemizinden.before-deploy.conf
            install -m 0644 "$RELEASE_DIR/nginx-ztemizinden.conf" "$NGINX_SITE_TARGET"
            if ! nginx -t; then
              install -m 0644 /var/backups/maintly/nginx-ztemizinden.before-deploy.conf "$NGINX_SITE_TARGET"
              nginx -t
              exit 1
            fi
            nginx -T 2>/dev/null | grep -Fq "proxy_pass http://127.0.0.1:8081;" || {
              echo "The active maintly.net TLS server does not include $NGINX_SNIPPET"
              exit 1
            }
            nginx -T 2>/dev/null | grep -Fq "listen 443 ssl http2;" || {
              echo "HTTP/2 is not enabled for maintly.net"
              exit 1
            }
            systemctl reload nginx

            docker compose --env-file "$IDENTITY_ENV" -f "$IDENTITY_DIR/docker-compose.yml" config -q
            docker compose --env-file "$IDENTITY_ENV" -f "$IDENTITY_DIR/docker-compose.yml" up -d

            keycloak_ready=false
            for attempt in $(seq 1 90); do
              if curl -fsS http://127.0.0.1:9000/health/ready >/dev/null; then
                keycloak_ready=true
                break
              fi
              sleep 2
            done
            if [ "$keycloak_ready" != true ]; then
              docker compose --env-file "$IDENTITY_ENV" -f "$IDENTITY_DIR/docker-compose.yml" ps
              docker compose --env-file "$IDENTITY_ENV" -f "$IDENTITY_DIR/docker-compose.yml" logs --tail=160 keycloak
              exit 1
            fi

            docker exec maintly-keycloak sh -c '
              /opt/keycloak/bin/kcadm.sh config credentials --server http://127.0.0.1:8080/auth --realm master --user "$KC_BOOTSTRAP_ADMIN_USERNAME" --password "$KC_BOOTSTRAP_ADMIN_PASSWORD"
              /opt/keycloak/bin/kcadm.sh update realms/ztemizinden -s loginTheme=maintly -s displayName=Maintly -s internationalizationEnabled=true -s defaultLocale=tr -s '\''supportedLocales=["tr","en"]'\''
              WEB_CLIENT_ID=$(/opt/keycloak/bin/kcadm.sh get clients -r ztemizinden --query clientId=ztemizinden-web --fields id | grep id | cut -d: -f2 | tr -d " \",")
              if [ -n "$WEB_CLIENT_ID" ]; then
                /opt/keycloak/bin/kcadm.sh update clients/$WEB_CLIENT_ID -r ztemizinden -s directAccessGrantsEnabled=true
              fi
            '

            python3 - "$IDENTITY_ENV" <<'PY'
            import json
            import sys
            import urllib.error
            import urllib.parse
            import urllib.request

            identity_env_path = sys.argv[1]

            def read_env(path):
                values = {}
                with open(path, encoding="utf-8") as env_file:
                    for raw_line in env_file:
                        line = raw_line.strip()
                        if not line or line.startswith("#") or "=" not in line:
                            continue
                        key, value = line.split("=", 1)
                        value = value.strip()
                        if (
                            len(value) >= 2
                            and value[0] == value[-1]
                            and value[0] in {"'", '"'}
                        ):
                            value = value[1:-1]
                        values[key.strip()] = value
                return values

            env = read_env(identity_env_path)
            admin_email = env["MAINTLY_ADMIN_EMAIL"].strip().lower()
            admin_password = env["MAINTLY_ADMIN_PASSWORD"]

            if "@" not in admin_email:
                raise SystemExit("MAINTLY_ADMIN_EMAIL must be a valid email address")
            password_policy_errors = []
            if len(admin_password) < 10:
                password_policy_errors.append("at least 10 characters")
            if not any(character.isupper() for character in admin_password):
                password_policy_errors.append("one uppercase letter")
            if not any(character.islower() for character in admin_password):
                password_policy_errors.append("one lowercase letter")
            if not any(character.isdigit() for character in admin_password):
                password_policy_errors.append("one digit")
            if not any(not character.isalnum() for character in admin_password):
                password_policy_errors.append("one special character")
            if password_policy_errors:
                raise SystemExit(
                    "MAINTLY_ADMIN_PASSWORD must contain "
                    + ", ".join(password_policy_errors)
                )

            keycloak_base = "http://127.0.0.1:8081/auth"
            token_url = f"{keycloak_base}/realms/master/protocol/openid-connect/token"
            realm_admin_url = f"{keycloak_base}/admin/realms/ztemizinden"

            def request(method, url, token=None, data=None, headers=None, expected=(200, 201, 204)):
                body = None
                request_headers = {"Accept": "application/json"}
                if headers:
                    request_headers.update(headers)
                if token:
                    request_headers["Authorization"] = f"Bearer {token}"
                if data is not None:
                    body = json.dumps(data).encode("utf-8")
                    request_headers["Content-Type"] = "application/json"
                req = urllib.request.Request(url, data=body, headers=request_headers, method=method)
                try:
                    with urllib.request.urlopen(req, timeout=30) as response:
                        payload = response.read().decode("utf-8")
                        if response.status not in expected:
                            raise RuntimeError(f"{method} {url} returned {response.status}: {payload}")
                        return response.status, payload
                except urllib.error.HTTPError as error:
                    payload = error.read().decode("utf-8")
                    raise RuntimeError(f"{method} {url} returned {error.code}: {payload}") from error

            def form_request(url, fields, expected=(200,)):
                body = urllib.parse.urlencode(fields).encode("utf-8")
                req = urllib.request.Request(
                    url,
                    data=body,
                    headers={
                        "Accept": "application/json",
                        "Content-Type": "application/x-www-form-urlencoded",
                    },
                    method="POST",
                )
                try:
                    with urllib.request.urlopen(req, timeout=30) as response:
                        payload = response.read().decode("utf-8")
                        if response.status not in expected:
                            raise RuntimeError(f"POST {url} returned {response.status}: {payload}")
                        return json.loads(payload) if payload else {}
                except urllib.error.HTTPError as error:
                    payload = error.read().decode("utf-8")
                    raise RuntimeError(f"POST {url} returned {error.code}: {payload}") from error

            admin_token = form_request(
                token_url,
                {
                    "grant_type": "password",
                    "client_id": "admin-cli",
                    "username": env["KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME"],
                    "password": env["KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD"],
                },
            )["access_token"]

            search = urllib.parse.urlencode({"username": admin_email, "exact": "true"})
            _, search_payload = request(
                "GET",
                f"{realm_admin_url}/users?{search}",
                token=admin_token,
            )
            matches = json.loads(search_payload or "[]")
            admin_user = matches[0] if matches else None

            user_payload = {
                "username": admin_email,
                "email": admin_email,
                "enabled": True,
                "emailVerified": True,
                "firstName": "Maintly",
                "lastName": "Admin",
            }

            if admin_user:
                user_id = admin_user["id"]
                request(
                    "PUT",
                    f"{realm_admin_url}/users/{urllib.parse.quote(user_id)}",
                    token=admin_token,
                    data={**admin_user, **user_payload},
                )
            else:
                request(
                    "POST",
                    f"{realm_admin_url}/users",
                    token=admin_token,
                    data={
                        **user_payload,
                        "credentials": [
                            {
                                "type": "password",
                                "value": admin_password,
                                "temporary": False,
                            }
                        ],
                    },
                )
                _, search_payload = request(
                    "GET",
                    f"{realm_admin_url}/users?{search}",
                    token=admin_token,
                )
                matches = json.loads(search_payload or "[]")
                if not matches:
                    raise SystemExit("Maintly admin user was not created")
                user_id = matches[0]["id"]

            request(
                "PUT",
                f"{realm_admin_url}/users/{urllib.parse.quote(user_id)}/reset-password",
                token=admin_token,
                data={
                    "type": "password",
                    "value": admin_password,
                    "temporary": False,
                },
            )

            _, role_payload = request("GET", f"{realm_admin_url}/roles/ADMIN", token=admin_token)
            admin_role = json.loads(role_payload)
            _, mappings_payload = request(
                "GET",
                f"{realm_admin_url}/users/{urllib.parse.quote(user_id)}/role-mappings/realm",
                token=admin_token,
            )
            current_roles = json.loads(mappings_payload or "[]")
            current_role_names = {role["name"] for role in current_roles}

            if "ADMIN" not in current_role_names:
                request(
                    "POST",
                    f"{realm_admin_url}/users/{urllib.parse.quote(user_id)}/role-mappings/realm",
                    token=admin_token,
                    data=[admin_role],
                    expected=(204,),
                )

            removable_roles = [
                role for role in current_roles
                if role.get("name") in {"CUSTOMER", "SERVICE"}
            ]
            if removable_roles:
                request(
                    "DELETE",
                    f"{realm_admin_url}/users/{urllib.parse.quote(user_id)}/role-mappings/realm",
                    token=admin_token,
                    data=removable_roles,
                    expected=(204,),
                )

            form_request(
                f"{keycloak_base}/realms/ztemizinden/protocol/openid-connect/token",
                {
                    "grant_type": "password",
                    "client_id": "ztemizinden-web",
                    "username": admin_email,
                    "password": admin_password,
                    "scope": "openid",
                },
            )
            print(f"Maintly production admin user verified: {admin_email}")
            PY

            realm_management_roles="$(
              python3 -c '
            import json
            import sys

            with open(sys.argv[1], encoding="utf-8") as realm_file:
                realm = json.load(realm_file)
            service_account = next(
                (user for user in realm.get("users", [])
                 if user.get("serviceAccountClientId") == "ztemizinden-backend-admin"),
                None,
            )
            roles = (service_account or {}).get("clientRoles", {}).get("realm-management", [])
            if not roles or any(not isinstance(role, str) or not role for role in roles):
                raise SystemExit("Invalid backend service-account role allowlist")
            print("\n".join(roles))
            ' "$IDENTITY_DIR/realm/realm-production.json"
            )"

            current_realm_management_roles="$(
              docker exec maintly-keycloak /opt/keycloak/bin/kcadm.sh \
                get-roles \
                -r ztemizinden \
                --uusername service-account-ztemizinden-backend-admin \
                --cclientid realm-management \
                --fields name \
                --format csv \
                --noquotes
            )"
            for current_role in $current_realm_management_roles; do
              role_is_allowed=false
              for allowed_role in $realm_management_roles; do
                if [ "$current_role" = "$allowed_role" ]; then
                  role_is_allowed=true
                  break
                fi
              done
              if [ "$role_is_allowed" = false ]; then
                docker exec maintly-keycloak /opt/keycloak/bin/kcadm.sh \
                  remove-roles \
                  -r ztemizinden \
                  --uusername service-account-ztemizinden-backend-admin \
                  --cclientid realm-management \
                  --rolename "$current_role"
              fi
            done

            for realm_management_role in $realm_management_roles; do
              docker exec maintly-keycloak /opt/keycloak/bin/kcadm.sh \
                add-roles \
                -r ztemizinden \
                --uusername service-account-ztemizinden-backend-admin \
                --cclientid realm-management \
                --rolename "$realm_management_role"
            done

            docker exec maintly-keycloak sh -ec '
              provisioning_config=/tmp/kcadm-provisioning.config
              rm -f "$provisioning_config"
              trap "rm -f \"$provisioning_config\"" EXIT
              /opt/keycloak/bin/kcadm.sh config credentials \
                --config "$provisioning_config" \
                --server http://127.0.0.1:8080/auth \
                --realm ztemizinden \
                --client ztemizinden-backend-admin \
                --secret "$KEYCLOAK_ADMIN_CLIENT_SECRET" >/dev/null
              /opt/keycloak/bin/kcadm.sh get roles/SERVICE \
                --config "$provisioning_config" \
                -r ztemizinden >/dev/null
            '
            echo "Keycloak provisioning service account permissions verified."

            if [ -s "$JAR_PATH" ]; then
              cp -p "$JAR_PATH" "$PREVIOUS_JAR"
            fi
            install -m 0644 "$RELEASE_DIR/ztemizinden.jar" "$JAR_PATH.next"
            chown ztemizinden:ztemizinden "$JAR_PATH.next"
            mv -f "$JAR_PATH.next" "$JAR_PATH"
            install -m 0644 "$RELEASE_DIR/ztemizinden.service" /etc/systemd/system/ztemizinden.service
            systemctl daemon-reload
            systemctl restart ztemizinden

            backend_ready=false
            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8080/api/public/landing >/dev/null; then
                backend_ready=true
                break
              fi
              sleep 2
            done

            if [ "$backend_ready" != true ]; then
              systemctl status ztemizinden --no-pager || true
              journalctl -u ztemizinden -n 180 --no-pager || true
              if [ -s "$PREVIOUS_JAR" ]; then
                echo "Backend health check failed; restoring previous JAR"
                install -m 0644 "$PREVIOUS_JAR" "$JAR_PATH"
                chown ztemizinden:ztemizinden "$JAR_PATH"
                systemctl restart ztemizinden
              fi
              exit 1
            fi

            systemctl is-active --quiet ztemizinden
            curl -fsS https://maintly.net/api/public/landing >/dev/null
            curl -fsS https://maintly.net/auth/realms/ztemizinden/.well-known/openid-configuration >/dev/null
            curl -fsS -D /tmp/maintly-silent-sso.headers \
              -o /dev/null \
              https://maintly.net/silent-check-sso.html
            grep -Fiqx $'x-frame-options: SAMEORIGIN\r' /tmp/maintly-silent-sso.headers || {
              echo "Silent SSO callback does not allow same-origin framing"
              cat /tmp/maintly-silent-sso.headers
              exit 1
            }
            rm -f /tmp/maintly-silent-sso.headers
            rm -rf "$RELEASE_DIR"
            echo "Maintly deployment completed and all health checks passed."
